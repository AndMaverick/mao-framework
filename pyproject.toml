[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mao-framework"
version = "0.1.0"
description = "Model, Action, Orchestration: a dependency-free framework for governed AI systems."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AndMaverick LLC" }]

[tool.setuptools.packages.find]
include = ["mao*"]
